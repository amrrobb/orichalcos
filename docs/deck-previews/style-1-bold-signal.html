<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Style 1 — Bold Signal</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.slide{width:100%;height:100vh;display:flex;flex-direction:column;justify-content:center;padding:clamp(2rem,6vw,6rem);position:relative;overflow:hidden}
.slide::before{content:"";position:absolute;top:0;left:0;width:8px;height:100%;background:linear-gradient(180deg,#d4a574,#8b6914)}
.tag{font-family:'JetBrains Mono',monospace;font-size:clamp(0.7rem,1vw,0.85rem);color:#d4a574;text-transform:uppercase;letter-spacing:0.2em;margin-bottom:clamp(1.5rem,3vw,2.5rem);opacity:0.85}
h1{font-size:clamp(2.5rem,7vw,5.5rem);font-weight:700;line-height:1;letter-spacing:-0.02em;margin-bottom:clamp(1rem,2vw,1.5rem)}
h1 .accent{color:#d4a574;display:block}
.sub{font-size:clamp(1rem,1.6vw,1.4rem);color:#a0a0a0;max-width:640px;line-height:1.5;margin-top:clamp(1rem,2vw,2rem)}
.meta{position:absolute;bottom:clamp(1.5rem,3vw,3rem);left:clamp(2rem,6vw,6rem);font-family:'JetBrains Mono',monospace;font-size:clamp(0.65rem,0.9vw,0.8rem);color:#666;letter-spacing:0.1em}
.meta span{color:#d4a574}
</style></head><body>
<section class="slide">
<p class="tag">Orichalcos · 0G APAC Hackathon · Track 2</p>
<h1>Risk-management<br><span class="accent">for AI traders.</span></h1>
<p class="sub">A protocol where AI strategies stay sealed, allocator capital stays safe, and every trade is verifiable on chain — without revealing the alpha.</p>
<p class="meta">Style 1 · <span>Bold Signal</span> · brass accent + heavy display type</p>
</section></body></html>
